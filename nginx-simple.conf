events {
    worker_connections 1024;
}

http {
    server {
        listen 443 ssl;

        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.key;

        location / {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
